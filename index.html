<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>מלחמת חלל</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            touch-action: none; /* Prevent scroll on touch */
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none; /* Let touches pass through to canvas */
            font-size: 20px;
            font-weight: bold;
        }
        #gameover, #start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(10, 15, 30, 0.95);
            padding: 25px;
            border: 3px solid #00ffff;
            border-radius: 15px;
            z-index: 100;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.4);
            max-width: 90vw;
            box-sizing: border-box;
        }
        #gameover {
            display: none;
        }
        #shop-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #0d1733 0%, #030611 100%);
            z-index: 200;
            box-sizing: border-box;
            padding: 20px 20px 70px 20px;
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            text-align: center;
        }
        .shop-container {
            max-width: 550px;
            margin: 0 auto;
            padding-bottom: 50px;
            touch-action: pan-y;
        }
        .shop-close-top {
            position: absolute;
            top: 15px;
            left: 15px;
            width: 38px;
            height: 38px;
            background: rgba(255, 68, 68, 0.85);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 210;
        }
        .btn {
            padding: 12px 24px;
            font-size: 20px;
            margin: 8px 4px;
            pointer-events: auto;
            cursor: pointer;
            background-color: #00ffff;
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.1s, background-color 0.2s;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-shop {
            background-color: #ffd700;
            color: #000;
        }
        .btn-close {
            background-color: #ff4444;
            color: #fff;
        }
        .shop-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
        }
        .tab-btn {
            padding: 8px 14px;
            font-size: 15px;
            background: #1a223a;
            color: #fff;
            border: 1px solid #00ffff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active {
            background: #00ffff;
            color: #000;
        }
        .shop-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            text-align: right;
            direction: rtl;
        }
        .shop-item h3 {
            margin: 0 0 6px 0;
            color: #00ffff;
            font-size: 17px;
        }
        .shop-item p {
            margin: 0 0 10px 0;
            font-size: 13px;
            color: #ddd;
            line-height: 1.4;
        }
        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .price-tag {
            color: #ffd700;
            font-weight: bold;
            font-size: 15px;
        }
        .btn-buy {
            padding: 6px 14px;
            font-size: 14px;
            background: #00ff88;
            color: black;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-buy.owned {
            background: #666;
            color: #bbb;
            cursor: default;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>חיים: <span id="hp">100</span></div>
        <div>מטבעות: <span id="coins">0</span></div>
        <div>גל: <span id="wave">1</span></div>
    </div>
    <div id="start-screen">
        <h1>מלחמת חלל</h1>
        <button class="btn" onclick="startGameFromMenu()">התחל משחק</button>
        <br>
        <button class="btn btn-shop" onclick="openShop('menu')">🛒 חנות</button>
    </div>
    <div id="gameover">
        <h1>המשחק נגמר!</h1>
        <p>הגעת לגל <span id="final-wave"></span></p>
        <p>מטבעות: <span id="final-coins"></span> 🪙</p>
        <button class="btn" onclick="startGame()">שחק שוב</button>
        <br>
        <button class="btn btn-shop" onclick="openShop('gameover')">🛒 חנות</button>
    </div>

    <!-- Shop Modal (Full Screen) -->
    <div id="shop-modal">
        <div class="shop-close-top" onclick="closeShop()">✕</div>
        <div class="shop-container">
            <h2 style="font-size: 26px; margin: 10px 0; color: #00ffff; text-shadow: 0 0 10px #00ffff;">🛒 חנות החלל</h2>
            <div style="color: #ffd700; font-size: 20px; font-weight: bold; margin-bottom: 15px;">
                המטבעות שלך: <span id="shop-coins">0</span> 🪙
            </div>
            
            <div class="shop-tabs">
                <button class="tab-btn active" id="tab-skills-btn" onclick="switchShopTab('skills')">יכולות מיוחדות</button>
                <button class="tab-btn" id="tab-powerups-btn" onclick="switchShopTab('powerups')">פאוור אפים</button>
            </div>

            <div id="tab-skills" class="tab-content">
                <div class="shop-item">
                    <h3>⏳ האטת זמן</h3>
                    <p>מאיט את מהירות הלייזרים והירייות של חלליות האויב ב-20% באופן קבוע!</p>
                    <div class="item-footer">
                        <span class="price-tag">100 🪙</span>
                        <button id="buy-slowmo-btn" class="btn-buy" onclick="buyTimeSlow()">קנה</button>
                    </div>
                </div>
            </div>

            <div id="tab-powerups" class="tab-content" style="display: none;">
                <div class="shop-item" style="text-align: center; color: #aaa;">
                    <p>בקרוב יתווספו פאוור אפים חדשים לחנות! ⚡</p>
                </div>
            </div>

            <button class="btn btn-close" style="width: 100%; margin-top: 15px;" onclick="closeShop()">✕ סגור חנות</button>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hpDisplay = document.getElementById('hp');
        const coinsDisplay = document.getElementById('coins');
        const waveDisplay = document.getElementById('wave');
        const gameoverScreen = document.getElementById('gameover');
        const finalWaveDisplay = document.getElementById('final-wave');
        const finalCoinsDisplay = document.getElementById('final-coins');
        const startScreen = document.getElementById('start-screen');
        const shopModal = document.getElementById('shop-modal');
        const shopCoinsDisplay = document.getElementById('shop-coins');
        const buySlowmoBtn = document.getElementById('buy-slowmo-btn');

        let width, height;
        let player, enemies, playerLasers, enemyLasers;
        let wave = 1;
        let coins = parseInt(localStorage.getItem('space_shooter_coins') || '0', 10);
        let hasSlowmo = localStorage.getItem('space_shooter_slowmo') === 'true';
        let shopPreviousScreen = 'menu';
        let isGameOver = false;
        let isGameStarted = false;
        let lastTime = 0;
        let isTouching = false;
        let lastShotTime = 0;

        const controlBarHeight = 65;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if (player) {
                player.y = height - controlBarHeight - player.height - 15;
            }
            if (enemies && enemies.length > 0) {
                enemies.forEach(enemy => {
                    enemy.y = 48;
                });
            }
        }
        window.addEventListener('resize', resize);
        window.addEventListener('orientationchange', () => {
            setTimeout(resize, 100);
        });
        resize();

        class Player {
            constructor() {
                this.width = 50;
                this.height = 50;
                this.x = width / 2 - this.width / 2;
                this.y = height - controlBarHeight - this.height - 15;
                this.hp = 100;
            }
            draw() {
                // Main body
                ctx.fillStyle = '#00ffff';
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y); // Nose
                ctx.lineTo(this.x + this.width, this.y + this.height); // Right Wing
                ctx.lineTo(this.x + this.width / 2, this.y + this.height - 15); // Engine indent
                ctx.lineTo(this.x, this.y + this.height); // Left Wing
                ctx.closePath();
                ctx.fill();
                
                // Cockpit window
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x + this.width / 2, this.y + this.height / 2, 6, 0, Math.PI * 2);
                ctx.fill();

                // Engine flame (animated randomly)
                ctx.fillStyle = '#ff9900';
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2 - 8, this.y + this.height - 12);
                ctx.lineTo(this.x + this.width / 2 + 8, this.y + this.height - 12);
                ctx.lineTo(this.x + this.width / 2, this.y + this.height + 5 + Math.random() * 15);
                ctx.closePath();
                ctx.fill();
            }
        }

        class Enemy {
            constructor(level, index, total) {
                this.width = 45;
                this.height = 45;
                let spacing = width / (total + 1);
                this.x = spacing * (index + 1) - this.width / 2;
                this.y = 48; // Right below the top UI bar at the top of the screen
                this.hp = 100;
                this.level = level;
                this.speed = (Math.random() > 0.5 ? 1 : -1) * (1.5 + level * 0.3);
                this.shootCooldown = Math.random() * 1000;
            }
            update(dt) {
                this.x += this.speed * (dt / 16);
                if (this.x <= 0) {
                    this.x = 0;
                    this.speed = Math.abs(this.speed); // Always positive to move right
                } else if (this.x + this.width >= width) {
                    this.x = width - this.width;
                    this.speed = -Math.abs(this.speed); // Always negative to move left
                }
                
                this.shootCooldown -= dt;
                // Randomly shoot
                if (this.shootCooldown <= 0 && Math.random() < 0.02 + (this.level * 0.005)) {
                    let laserSpeed = (6 + this.level * 0.5) * (hasSlowmo ? 0.8 : 1.0);
                    enemyLasers.push(new Laser(this.x + this.width / 2, this.y + this.height, laserSpeed, 'enemy'));
                    let baseCooldown = 1500 - (this.level * 80);
                    this.shootCooldown = hasSlowmo ? (baseCooldown * 1.25) : baseCooldown; // 20% slower rate of fire
                }
            }
            draw() {
                // Main body
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y + this.height); // Nose (pointing down)
                ctx.lineTo(this.x + this.width, this.y); // Right Wing
                ctx.lineTo(this.x + this.width / 2, this.y + 15); // Engine indent
                ctx.lineTo(this.x, this.y); // Left Wing
                ctx.closePath();
                ctx.fill();

                // Cockpit window
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(this.x + this.width / 2, this.y + this.height / 2, 6, 0, Math.PI * 2);
                ctx.fill();

                // Small engine flames
                ctx.fillStyle = '#ff9900';
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2 - 12, this.y + 8);
                ctx.lineTo(this.x + this.width / 2 - 4, this.y + 12);
                ctx.lineTo(this.x + this.width / 2 - 8, this.y - Math.random() * 10);
                ctx.closePath();
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2 + 4, this.y + 12);
                ctx.lineTo(this.x + this.width / 2 + 12, this.y + 8);
                ctx.lineTo(this.x + this.width / 2 + 8, this.y - Math.random() * 10);
                ctx.closePath();
                ctx.fill();
                
                // Draw HP bar
                ctx.fillStyle = 'red';
                ctx.fillRect(this.x, this.y - 8, this.width, 5);
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(this.x, this.y - 8, this.width * (this.hp / 100), 5);
                
                // Draw level text
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('רמה ' + this.level, this.x + this.width / 2, this.y - 12);
            }
        }

        class Laser {
            constructor(x, y, speedY, type) {
                this.x = x;
                this.y = y;
                this.width = 6;
                this.height = 20;
                this.speedY = speedY;
                this.type = type;
            }
            update(dt) {
                this.y += this.speedY * (dt / 16);
            }
            draw() {
                ctx.fillStyle = this.type === 'player' ? '#00ff00' : '#ff00ff';
                ctx.fillRect(this.x - this.width / 2, this.y, this.width, this.height);
            }
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function spawnWave(w) {
            enemies = [];
            let numEnemies = 5; 
            let level = Math.min(w, 10); // Levels 1 to 10
            for (let i = 0; i < numEnemies; i++) {
                enemies.push(new Enemy(level, i, numEnemies));
            }
        }
        function openShop(fromScreen) {
            shopPreviousScreen = fromScreen;
            startScreen.style.display = 'none';
            gameoverScreen.style.display = 'none';
            shopModal.style.display = 'block';
            updateShopUI();
        }

        function closeShop() {
            shopModal.style.display = 'none';
            if (shopPreviousScreen === 'menu') {
                startScreen.style.display = 'block';
            } else {
                gameoverScreen.style.display = 'block';
            }
        }

        function switchShopTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.style.display = 'none');

            document.getElementById('tab-' + tabName + '-btn').classList.add('active');
            document.getElementById('tab-' + tabName).style.display = 'block';
        }

        function updateShopUI() {
            shopCoinsDisplay.innerText = coins;
            if (hasSlowmo) {
                buySlowmoBtn.innerText = 'נרכש ✔';
                buySlowmoBtn.classList.add('owned');
                buySlowmoBtn.disabled = true;
            } else {
                buySlowmoBtn.innerText = 'קנה (100 🪙)';
                buySlowmoBtn.classList.remove('owned');
                buySlowmoBtn.disabled = false;
            }
        }

        function buyTimeSlow() {
            if (hasSlowmo) return;
            if (coins >= 100) {
                coins -= 100;
                hasSlowmo = true;
                localStorage.setItem('space_shooter_coins', coins.toString());
                localStorage.setItem('space_shooter_slowmo', 'true');
                updateUI();
                updateShopUI();
                alert('רכשת בהצלחה את היכולת "האטת זמן"! יריות האויבים יהיו איטיות ב-20%!');
            } else {
                alert('אין לך מספיק מטבעות! חסרים לך ' + (100 - coins) + ' מטבעות.');
            }
        }

        function startGameFromMenu() {
            startScreen.style.display = 'none';
            shopModal.style.display = 'none';
            isGameStarted = true;
            startGame();
        }

        function startGame() {
            player = new Player();
            playerLasers = [];
            enemyLasers = [];
            wave = 1;
            isGameOver = false;
            gameoverScreen.style.display = 'none';
            shopModal.style.display = 'none';
            spawnWave(wave);
            updateUI();
            lastTime = performance.now();
        }

        function updateUI() {
            if (player) hpDisplay.innerText = player.hp;
            waveDisplay.innerText = wave;
            coinsDisplay.innerText = coins;
        }

        function gameOver() {
            isGameOver = true;
            finalWaveDisplay.innerText = wave;
            finalCoinsDisplay.innerText = coins;
            localStorage.setItem('space_shooter_coins', coins.toString());
            gameoverScreen.style.display = 'block';
        }

        // Controls
        function handleInput(x, y) {
            if (isGameOver || !player) return;
            player.x = x - player.width / 2;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > width) player.x = width - player.width;
        }

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isTouching = true;
            if (e.touches.length > 0) {
                handleInput(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                handleInput(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            isTouching = false;
        }, { passive: false });
        
        canvas.addEventListener('mousedown', (e) => {
            isTouching = true;
            handleInput(e.clientX, e.clientY);
        });
        canvas.addEventListener('mousemove', (e) => {
            if(isTouching) handleInput(e.clientX, e.clientY);
        });
        canvas.addEventListener('mouseup', () => {
            isTouching = false;
        });

        // Add automatic shooting when touching/clicking
        function gameLoop(timestamp) {
            let dt = timestamp - lastTime;
            lastTime = timestamp;
            if (dt > 100) dt = 100;

            ctx.clearRect(0, 0, width, height);

            // Draw Stars background
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for(let i=0; i<15; i++){
                ctx.fillRect(Math.random()*width, Math.random()*height, 2, 2);
            }

            // Draw Bottom Touch Control Bar
            const barY = height - controlBarHeight;
            // Background track
            ctx.fillStyle = 'rgba(20, 25, 45, 0.9)';
            ctx.fillRect(0, barY, width, controlBarHeight);

            // Top border for the bar
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, barY);
            ctx.lineTo(width, barY);
            ctx.stroke();

            // Center guide line
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(30, barY + controlBarHeight / 2);
            ctx.lineTo(width - 30, barY + controlBarHeight / 2);
            ctx.stroke();

            // Slider handle indicator matching player's X position
            const sliderX = player ? (player.x + player.width / 2) : (width / 2);
            const sliderY = barY + controlBarHeight / 2;
            ctx.fillStyle = '#00ffff';
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(sliderX, sliderY, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; // reset shadow

            // Small inner dot for slider
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(sliderX, sliderY, 8, 0, Math.PI * 2);
            ctx.fill();

            // Label text on the bar
            ctx.fillStyle = '#00ffff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('◄  החלק כאן להזזה  ►', width / 2, barY + 18);

            if (!isGameStarted || isGameOver) {
                requestAnimationFrame(gameLoop);
                return;
            }

            // Player Auto-Shooting while touching
            if (isTouching && timestamp - lastShotTime > 300) {
                playerLasers.push(new Laser(player.x + player.width / 2, player.y, -12, 'player'));
                lastShotTime = timestamp;
            }
            player.draw();

            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];
                enemy.update(dt);
                enemy.draw();
            }

            for (let i = playerLasers.length - 1; i >= 0; i--) {
                let laser = playerLasers[i];
                laser.update(dt);
                laser.draw();

                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let enemy = enemies[j];
                    if (checkCollision(laser, enemy)) {
                        enemy.hp -= 20; 
                        hit = true;
                        if (enemy.hp <= 0) {
                            coins += enemy.level * 2;
                            localStorage.setItem('space_shooter_coins', coins.toString());
                            enemies.splice(j, 1);
                            updateUI();
                        }
                        break;
                    }
                }
                
                if (hit || laser.y < -20) {
                    playerLasers.splice(i, 1);
                }
            }

            for (let i = enemyLasers.length - 1; i >= 0; i--) {
                let laser = enemyLasers[i];
                laser.update(dt);
                laser.draw();

                if (checkCollision(laser, player)) {
                    player.hp -= 20; 
                    enemyLasers.splice(i, 1);
                    updateUI();
                    if (player.hp <= 0) {
                        gameOver();
                    }
                    continue;
                }

                if (laser.y > height + 20) {
                    enemyLasers.splice(i, 1);
                }
            }

            if (enemies.length === 0 && !isGameOver) {
                wave++;
                spawnWave(wave);
                updateUI();
            }

            requestAnimationFrame(gameLoop);
        }

        updateUI();
        requestAnimationFrame(gameLoop);

        // Auto-refresh mechanism on mobile when reopening or when version changes
        const CURRENT_APP_VERSION = "1.3.0";
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                // If the user returns to the game on mobile, check for updates
                fetch(window.location.pathname + '?check=' + Date.now(), { cache: 'no-store' })
                    .then(res => res.text())
                    .then(html => {
                        const match = html.match(/CURRENT_APP_VERSION\s*=\s*"([^"]+)"/);
                        if (match && match[1] && match[1] !== CURRENT_APP_VERSION) {
                            window.location.reload();
                        }
                    }).catch(() => {});
            }
        });
    </script>
</body>
</html>
