<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>מלחמת חלל</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            touch-action: none; /* Prevent scroll on touch */
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none; /* Let touches pass through to canvas */
            font-size: 20px;
            font-weight: bold;
        }
        #gameover, #start-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border: 3px solid #00ffff;
            border-radius: 15px;
            z-index: 100;
        }
        #gameover {
            display: none;
        }
        button {
            padding: 15px 30px;
            font-size: 24px;
            margin-top: 20px;
            pointer-events: auto;
            cursor: pointer;
            background-color: #00ffff;
            color: black;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>חיים: <span id="hp">100</span></div>
        <div>מטבעות: <span id="coins">0</span></div>
        <div>גל: <span id="wave">1</span></div>
    </div>
    <div id="start-screen">
        <h1>מלחמת חלל</h1>
        <button onclick="startGameFromMenu()">התחל משחק</button>
    </div>
    <div id="gameover">
        <h1>המשחק נגמר!</h1>
        <p>הגעת לגל <span id="final-wave"></span></p>
        <p>מטבעות שנאספו: <span id="final-coins"></span></p>
        <button onclick="startGame()">שחק שוב</button>
    </div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hpDisplay = document.getElementById('hp');
        const coinsDisplay = document.getElementById('coins');
        const waveDisplay = document.getElementById('wave');
        const gameoverScreen = document.getElementById('gameover');
        const finalWaveDisplay = document.getElementById('final-wave');
        const finalCoinsDisplay = document.getElementById('final-coins');
        const startScreen = document.getElementById('start-screen');

        let width, height;
        let player, enemies, playerLasers, enemyLasers;
        let wave = 1;
        let coins = 0;
        let isGameOver = false;
        let isGameStarted = false;
        let lastTime = 0;
        let isTouching = false;
        let lastShotTime = 0;

        const controlBarHeight = 65;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            if(player) {
                player.y = height - controlBarHeight - player.height - 15;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        class Player {
            constructor() {
                this.width = 50;
                this.height = 50;
                this.x = width / 2 - this.width / 2;
                this.y = height - controlBarHeight - this.height - 15;
                this.hp = 100;
            }
            draw() {
                // Main body
                ctx.fillStyle = '#00ffff';
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y); // Nose
                ctx.lineTo(this.x + this.width, this.y + this.height); // Right Wing
                ctx.lineTo(this.x + this.width / 2, this.y + this.height - 15); // Engine indent
                ctx.lineTo(this.x, this.y + this.height); // Left Wing
                ctx.closePath();
                ctx.fill();
                
                // Cockpit window
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x + this.width / 2, this.y + this.height / 2, 6, 0, Math.PI * 2);
                ctx.fill();

                // Engine flame (animated randomly)
                ctx.fillStyle = '#ff9900';
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2 - 8, this.y + this.height - 12);
                ctx.lineTo(this.x + this.width / 2 + 8, this.y + this.height - 12);
                ctx.lineTo(this.x + this.width / 2, this.y + this.height + 5 + Math.random() * 15);
                ctx.closePath();
                ctx.fill();
            }
        }

        class Enemy {
            constructor(level, index, total) {
                this.width = 50;
                this.height = 50;
                let spacing = width / (total + 1);
                this.x = spacing * (index + 1) - this.width / 2;
                this.y = 60 + (Math.random() * 60);
                this.hp = 100;
                this.level = level;
                this.speed = (Math.random() > 0.5 ? 1 : -1) * (1.5 + level * 0.3);
                this.shootCooldown = Math.random() * 1000;
            }
            update(dt) {
                this.x += this.speed * (dt / 16);
                if (this.x <= 0) {
                    this.x = 0;
                    this.speed = Math.abs(this.speed); // Always positive to move right
                } else if (this.x + this.width >= width) {
                    this.x = width - this.width;
                    this.speed = -Math.abs(this.speed); // Always negative to move left
                }
                
                this.shootCooldown -= dt;
                // Randomly shoot
                if (this.shootCooldown <= 0 && Math.random() < 0.02 + (this.level * 0.005)) {
                    enemyLasers.push(new Laser(this.x + this.width / 2, this.y + this.height, 6 + this.level * 0.5, 'enemy'));
                    this.shootCooldown = 1500 - (this.level * 80); // Min time between shots
                }
            }
            draw() {
                // Main body
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y + this.height); // Nose (pointing down)
                ctx.lineTo(this.x + this.width, this.y); // Right Wing
                ctx.lineTo(this.x + this.width / 2, this.y + 15); // Engine indent
                ctx.lineTo(this.x, this.y); // Left Wing
                ctx.closePath();
                ctx.fill();

                // Cockpit window
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(this.x + this.width / 2, this.y + this.height / 2, 6, 0, Math.PI * 2);
                ctx.fill();

                // Small engine flames
                ctx.fillStyle = '#ff9900';
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2 - 12, this.y + 8);
                ctx.lineTo(this.x + this.width / 2 - 4, this.y + 12);
                ctx.lineTo(this.x + this.width / 2 - 8, this.y - Math.random() * 10);
                ctx.closePath();
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2 + 4, this.y + 12);
                ctx.lineTo(this.x + this.width / 2 + 12, this.y + 8);
                ctx.lineTo(this.x + this.width / 2 + 8, this.y - Math.random() * 10);
                ctx.closePath();
                ctx.fill();
                
                // Draw HP bar
                ctx.fillStyle = 'red';
                ctx.fillRect(this.x, this.y - 15, this.width, 6);
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(this.x, this.y - 15, this.width * (this.hp / 100), 6);
                
                // Draw level text
                ctx.fillStyle = 'white';
                ctx.font = '14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('רמה ' + this.level, this.x + this.width / 2, this.y - 20);
            }
        }

        class Laser {
            constructor(x, y, speedY, type) {
                this.x = x;
                this.y = y;
                this.width = 6;
                this.height = 20;
                this.speedY = speedY;
                this.type = type;
            }
            update(dt) {
                this.y += this.speedY * (dt / 16);
            }
            draw() {
                ctx.fillStyle = this.type === 'player' ? '#00ff00' : '#ff00ff';
                ctx.fillRect(this.x - this.width / 2, this.y, this.width, this.height);
            }
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function spawnWave(w) {
            enemies = [];
            let numEnemies = 5; 
            let level = Math.min(w, 10); // Levels 1 to 10
            for (let i = 0; i < numEnemies; i++) {
                enemies.push(new Enemy(level, i, numEnemies));
            }
        }
        function startGameFromMenu() {
            startScreen.style.display = 'none';
            isGameStarted = true;
            startGame();
        }

        function startGame() {
            player = new Player();
            playerLasers = [];
            enemyLasers = [];
            wave = 1;
            coins = 0;
            isGameOver = false;
            gameoverScreen.style.display = 'none';
            spawnWave(wave);
            updateUI();
            lastTime = performance.now();
        }

        function updateUI() {
            hpDisplay.innerText = player.hp;
            waveDisplay.innerText = wave;
            coinsDisplay.innerText = coins;
        }

        function gameOver() {
            isGameOver = true;
            finalWaveDisplay.innerText = wave;
            finalCoinsDisplay.innerText = coins;
            gameoverScreen.style.display = 'block';
        }

        // Controls
        function handleInput(x, y) {
            if (isGameOver || !player) return;
            player.x = x - player.width / 2;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > width) player.x = width - player.width;
        }

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isTouching = true;
            if (e.touches.length > 0) {
                handleInput(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length > 0) {
                handleInput(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            isTouching = false;
        }, { passive: false });
        
        canvas.addEventListener('mousedown', (e) => {
            isTouching = true;
            handleInput(e.clientX, e.clientY);
        });
        canvas.addEventListener('mousemove', (e) => {
            if(isTouching) handleInput(e.clientX, e.clientY);
        });
        canvas.addEventListener('mouseup', () => {
            isTouching = false;
        });

        // Add automatic shooting when touching/clicking
        function gameLoop(timestamp) {
            let dt = timestamp - lastTime;
            lastTime = timestamp;
            if (dt > 100) dt = 100;

            ctx.clearRect(0, 0, width, height);

            // Draw Stars background
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for(let i=0; i<15; i++){
                ctx.fillRect(Math.random()*width, Math.random()*height, 2, 2);
            }

            // Draw Bottom Touch Control Bar
            const barY = height - controlBarHeight;
            // Background track
            ctx.fillStyle = 'rgba(20, 25, 45, 0.9)';
            ctx.fillRect(0, barY, width, controlBarHeight);

            // Top border for the bar
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, barY);
            ctx.lineTo(width, barY);
            ctx.stroke();

            // Center guide line
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(30, barY + controlBarHeight / 2);
            ctx.lineTo(width - 30, barY + controlBarHeight / 2);
            ctx.stroke();

            // Slider handle indicator matching player's X position
            const sliderX = player ? (player.x + player.width / 2) : (width / 2);
            const sliderY = barY + controlBarHeight / 2;
            ctx.fillStyle = '#00ffff';
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(sliderX, sliderY, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; // reset shadow

            // Small inner dot for slider
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(sliderX, sliderY, 8, 0, Math.PI * 2);
            ctx.fill();

            // Label text on the bar
            ctx.fillStyle = '#00ffff';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('◄  החלק כאן להזזה  ►', width / 2, barY + 18);

            if (!isGameStarted || isGameOver) {
                requestAnimationFrame(gameLoop);
                return;
            }

            // Player Auto-Shooting while touching
            if (isTouching && timestamp - lastShotTime > 300) {
                playerLasers.push(new Laser(player.x + player.width / 2, player.y, -12, 'player'));
                lastShotTime = timestamp;
            }
            player.draw();

            for (let i = enemies.length - 1; i >= 0; i--) {
                let enemy = enemies[i];
                enemy.update(dt);
                enemy.draw();
            }

            for (let i = playerLasers.length - 1; i >= 0; i--) {
                let laser = playerLasers[i];
                laser.update(dt);
                laser.draw();

                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let enemy = enemies[j];
                    if (checkCollision(laser, enemy)) {
                        enemy.hp -= 20; 
                        hit = true;
                        if (enemy.hp <= 0) {
                            coins += enemy.level * 2;
                            enemies.splice(j, 1);
                            updateUI();
                        }
                        break;
                    }
                }
                
                if (hit || laser.y < -20) {
                    playerLasers.splice(i, 1);
                }
            }

            for (let i = enemyLasers.length - 1; i >= 0; i--) {
                let laser = enemyLasers[i];
                laser.update(dt);
                laser.draw();

                if (checkCollision(laser, player)) {
                    player.hp -= 20; 
                    enemyLasers.splice(i, 1);
                    updateUI();
                    if (player.hp <= 0) {
                        gameOver();
                    }
                    continue;
                }

                if (laser.y > height + 20) {
                    enemyLasers.splice(i, 1);
                }
            }

            if (enemies.length === 0 && !isGameOver) {
                wave++;
                spawnWave(wave);
                updateUI();
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
